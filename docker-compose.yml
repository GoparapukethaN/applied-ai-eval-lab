services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AIEL_ENVIRONMENT: local
      AIEL_FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

